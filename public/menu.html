<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Manager — LoyaltyPro</title>
  <link rel="stylesheet" href="menu.css">
</head>
<body>

<!-- TOP NAV -->
<nav>
  <a href="index.html" class="nav-back">← Dashboard</a>
  <h2>Menu Manager</h2>
  <span id="navRestaurantName" class="nav-rname"></span>
</nav>

<!-- PAGE CONTENT -->
<div class="page-wrap">

  <!-- LEFT: Category list -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Categories</span>
      <button class="btn-icon" id="addCatBtn" title="Add category" onclick="openAddCategory()">+</button>
    </div>

    <div id="categoryList" class="category-list">
      <div class="loading-text">Loading...</div>
    </div>
  </aside>

  <!-- RIGHT: Items panel -->
  <main class="items-panel">

    <!-- Items header -->
    <div class="items-header">
      <div>
        <h3 id="currentCategoryTitle">All Items</h3>
        <span id="itemCountBadge" class="count-badge">0 items</span>
      </div>
      <div class="items-header-actions">
        <input type="text" id="searchInput" placeholder="Search items..." oninput="filterItems()">
        <button class="btn-primary" onclick="openAddItem()">+ Add Item</button>
      </div>
    </div>

    <!-- Summary stats bar -->
    <div id="statsBar" class="stats-bar" style="display:none">
      <div class="stat-pill"><span id="statTotal">0</span> total items</div>
      <div class="stat-pill available"><span id="statAvailable">0</span> available</div>
      <div class="stat-pill unavailable"><span id="statUnavailable">0</span> unavailable</div>
      <div class="stat-pill multiplier"><span id="statMultiplier">0</span> with coin boost</div>
    </div>

    <!-- Items grid -->
    <div id="itemsGrid" class="items-grid">
      <div class="empty-state">
        <div class="empty-icon">🍽️</div>
        <div class="empty-title">No items yet</div>
        <div class="empty-sub">Click "+ Add Item" to add your first menu item</div>
      </div>
    </div>

  </main>
</div>


<!-- ════════ ADD / EDIT CATEGORY MODAL ════════ -->
<div id="categoryModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h3 id="categoryModalTitle">Add Category</h3>
      <button class="modal-close" onclick="closeCategoryModal()">✕</button>
    </div>
    <div class="modal-body">
      <label class="field-label">Category name <span class="required">*</span></label>
      <input type="text" id="categoryNameInput" class="field-input" placeholder="e.g. Starters, Mains, Drinks...">
      <div id="categoryError" class="field-error" style="display:none"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeCategoryModal()">Cancel</button>
      <button class="btn-primary" id="saveCategoryBtn" onclick="saveCategory()">Save Category</button>
    </div>
  </div>
</div>


<!-- ════════ ADD / EDIT ITEM MODAL ════════ -->
<div id="itemModal" class="modal-overlay" style="display:none">
  <div class="modal modal-wide">
    <div class="modal-header">
      <h3 id="itemModalTitle">Add Menu Item</h3>
      <button class="modal-close" onclick="closeItemModal()">✕</button>
    </div>
    <div class="modal-body">

      <div class="field-row">
        <div class="field-group" style="flex:2">
          <label class="field-label">Item name <span class="required">*</span></label>
          <input type="text" id="itemName" class="field-input" placeholder="e.g. Butter Chicken">
        </div>
        <div class="field-group">
          <label class="field-label">Category</label>
          <select id="itemCategory" class="field-input">
            <option value="">— No category —</option>
          </select>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Description <span class="optional">(optional)</span></label>
        <input type="text" id="itemDescription" class="field-input" placeholder="e.g. Rich tomato-based gravy with tender chicken">
      </div>

      <div class="field-row">
        <div class="field-group">
          <label class="field-label">Price (₹) <span class="required">*</span></label>
          <input type="number" id="itemPrice" class="field-input" placeholder="0.00" min="0" step="0.50">
        </div>
        <div class="field-group">
          <label class="field-label">Coin multiplier</label>
          <select id="itemMultiplier" class="field-input" onchange="updateMultiplierHint()">
            <option value="0.5">0.5× — Half coins</option>
            <option value="1" selected>1× — Normal</option>
            <option value="1.5">1.5× — Boost</option>
            <option value="2">2× — Double coins ⭐</option>
            <option value="3">3× — Triple coins 🔥</option>
            <option value="5">5× — Special event 🎉</option>
          </select>
          <div id="multiplierHint" class="field-hint"></div>
        </div>
      </div>

      <div class="field-group">
        <label class="toggle-label">
          <input type="checkbox" id="itemAvailable" checked>
          <span class="toggle-text">Item is available for ordering</span>
        </label>
        <div class="field-hint">Unavailable items won't appear when entering bills</div>
      </div>

      <div id="itemError" class="field-error" style="display:none"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeItemModal()">Cancel</button>
      <button class="btn-primary" id="saveItemBtn" onclick="saveItem()">Save Item</button>
    </div>
  </div>
</div>


<!-- ════════ DELETE CONFIRM MODAL ════════ -->
<div id="deleteModal" class="modal-overlay" style="display:none">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3>Confirm delete</h3>
      <button class="modal-close" onclick="closeDeleteModal()">✕</button>
    </div>
    <div class="modal-body">
      <p id="deleteMessage" style="color:var(--text-secondary);font-size:14px;line-height:1.6"></p>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeDeleteModal()">Cancel</button>
      <button class="btn-danger" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>


<script src="menu.js"></script>
</body>
</html>
